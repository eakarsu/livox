name: Verified file transfer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  file-transfer-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject unbaselined committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile and run verified delivery tests
        run: bash scripts/verify-file-transfer.sh
